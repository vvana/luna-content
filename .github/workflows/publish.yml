name: publish

on:
  schedule:
    # Moscow 08:00-12:00 (morning posts) and 14:00-22:00 (afternoon 15:00, evening 18:54).
    # Off-round minutes: GitHub drops many runs scheduled at :00/:15/:30/:45 under load.
    # Wide windows: GitHub cron often delays/skips runs; ig_publish.py only posts
    # due+non-stale items, extra runs are no-ops.
    - cron: '11,26,41,56 5-8,11-18 * * *'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python ig_publish.py
      - name: commit queue state
        run: |
          git config user.name "luna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ig-queue.json
          git diff --cached --quiet || { git commit -m "mark published"; git pull --rebase; git push; }
