name: publish

on:
  schedule:
    # Moscow 09:00-11:00 window (morning posts) and 18:00-20:00 (evening 19:00)
    - cron: '*/15 6-7,15-17 * * *'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python ig_publish.py
      - name: commit queue state
        run: |
          git config user.name "luna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ig-queue.json
          git diff --cached --quiet || { git commit -m "mark published"; git pull --rebase; git push; }
